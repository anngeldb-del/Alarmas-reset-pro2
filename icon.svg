<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#0d0d16"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#ff8c5a"/>
      <stop offset="100%" stop-color="#e85a20"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle grid pattern overlay -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" opacity="0.6"/>

  <!-- Shield body -->
  <path d="M256 68 L404 126 L404 274 Q404 382 256 452 Q108 382 108 274 L108 126 Z"
        fill="url(#shield-grad)" filter="url(#glow)"/>

  <!-- Shield inner dark cavity -->
  <path d="M256 106 L374 157 L374 272 Q374 362 256 424 Q138 362 138 272 L138 157 Z"
        fill="#0f0f1c"/>

  <!-- WiFi signal arcs — orange -->
  <g stroke="#ff6b35" fill="none" stroke-linecap="round">
    <path d="M178 254 Q256 196 334 254" stroke-width="20" opacity="0.40"/>
    <path d="M202 282 Q256 236 310 282" stroke-width="20" opacity="0.70"/>
    <path d="M226 310 Q256 288 286 310" stroke-width="20"/>
  </g>

  <!-- Center dot -->
  <circle cx="256" cy="342" r="22" fill="#ff6b35"/>

  <!-- Green status badge (top-right of shield) -->
  <circle cx="374" cy="146" r="40" fill="#06d6a0"/>
  <!-- Checkmark inside badge -->
  <polyline points="356,146 370,162 396,132"
            stroke="white" stroke-width="8" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
